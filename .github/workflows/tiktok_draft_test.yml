name: TikTok Draft Upload Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload-tiktok-draft:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install requests

      - name: Upload Honda reel to TikTok draft
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TIKTOK_VIDEO_URL: https://mini16111985-hub.github.io/tmg-ig-reels/reels/generated/honda-city-turbo-ii-1983.mp4
        run: python scripts/upload_tiktok_draft.py
